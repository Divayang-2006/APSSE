version: '3.8'

services:
  # Standalone Vector Database (Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: apsse-qdrant
    ports:
      - "6333:6333" # REST & Web UI
      - "6334:6334" # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Similarity Search & Inference Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apsse-engine
    ports:
      - "8000:8000"
    environment:
      - DEFAULT_MODEL=vit
      - CLUSTER_NODE_ID=node-worker-01
      - PORT=8000
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./backend/static:/app/backend/static
      - ./backend/qdrant_storage:/app/backend/qdrant_storage
      - ./dataset/extracted:/app/dataset/extracted
    depends_on:
      - qdrant
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Web Dashboard
  frontend:
    image: node:20-alpine
    container_name: apsse-ui
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped
